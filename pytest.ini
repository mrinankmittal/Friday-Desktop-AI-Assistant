[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers --strict-config
markers =
    router: intent classification must keep routing spoken phrases to the same tools
    tools: tool registry contract (schemas, manifest, audit)
    permissions: confirm gate, file allowlist, secret handling
    integration: multi-step flow through the orchestrator
filterwarnings =
    ignore:.*nestedExpr.*:DeprecationWarning
    ignore:.*excludeChars.*:DeprecationWarning
